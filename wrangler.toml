name = "adegamm"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Domínio próprio (www.adegamm.com.br e adegamm.com.br, que o Worker
# redireciona pro www) ligado como Custom Domain pela API/painel, não aqui:
# declarado neste arquivo, o deploy falha enquanto a zona ainda está
# "pending" esperando a troca de DNS no Registro.br.

[[d1_databases]]
binding = "DB"
database_name = "adegamm-db"
database_id = "9b98e4eb-4a92-4de1-b627-99d366d8b30f"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
# O Worker passa na frente de tudo: precisa redirecionar o domínio sem www,
# atender /api e servir /loja com o mesmo arquivo do /cardapio.
run_worker_first = true
